[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "gis-kpi-metric-data-service"
version = "0.1.0"
description = "GIS KPI SQLAlchemy models, schemas, and services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["SQLAlchemy>=2,<3", "pydantic>=2,<3"]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3"]
test = ["pytest>=8", "psycopg[binary]>=3"]
docs = ["sphinx>=8,<9", "myst-parser>=4", "pydata-sphinx-theme>=0.16", "sphinx-simplepdf>=1.7"]
dev = ["pytest>=8", "psycopg[binary]>=3", "build>=1", "twine>=6", "sphinx>=8,<9", "myst-parser>=4", "pydata-sphinx-theme>=0.16", "sphinx-simplepdf>=1.7", "PyYAML>=6", "packaging>=24"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
