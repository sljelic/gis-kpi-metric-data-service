name: package-registry-validation
on:
  pull_request:
  push:
    branches: [main, develop, integration, production, 'feature/**', 'release/**', 'hotfix/**', 'codex/**']
permissions:
  contents: read
env:
  PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
  PYPI_READ_USERNAME: ${{ vars.PYPI_READ_USERNAME }}
  PYPI_READ_TOKEN: ${{ secrets.PYPI_READ_TOKEN }}
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/registry.py install -e '.[dev]'
      - run: python scripts/test_registry.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:release
      - run: pytest
      - run: python scripts/registry.py run python -m build
      - run: python scripts/registry.py validate
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Verify wheel installation outside checkout
        shell: bash
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/package-wheel"
          "$RUNNER_TEMP/package-wheel/bin/pip" install --no-deps --force-reinstall dist/*.whl
          cp scripts/check_distribution.py "$RUNNER_TEMP/check_distribution.py"
          cd "$RUNNER_TEMP"
          VIRTUAL_ENV="$RUNNER_TEMP/package-wheel" "$RUNNER_TEMP/package-wheel/bin/python" check_distribution.py
      - run: sphinx-build -W -b html docs docs/_build/html
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: sphinx-build -W -b simplepdf docs docs/_build/pdf
